name: Marketing web tests
on:
  push:
    paths: ['web/**', '.github/workflows/web-tests.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
        working-directory: web
      - run: node --check web/public/app.js
